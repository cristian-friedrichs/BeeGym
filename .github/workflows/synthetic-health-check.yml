name: BeeGym Synthetic Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  issues: write

jobs:
  synthetic-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Basic Synthetic Monitoring
        run: node testsprite_tests/basic-synthetic-monitoring/smoke.mjs

      - name: Upload Synthetic Health Report
        if: ${{ always() && hashFiles('testsprite_tests/basic-synthetic-monitoring/reports/latest-smoke-report.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: beegym-synthetic-health-report
          path: testsprite_tests/basic-synthetic-monitoring/reports/latest-smoke-report.json

      - name: Create or Update Failure Issue
        if: ${{ failure() }}
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[Watchtower] Synthetic Health Check failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const branch = context.ref.startsWith('refs/heads/')
              ? context.ref.replace('refs/heads/', '')
              : context.ref;
            const timestamp = new Date().toISOString();

            const body = [
              'Synthetic health check failed and needs triage.',
              '',
              `- UTC time: ${timestamp}`,
              `- Workflow: ${context.workflow}`,
              `- Run ID: ${context.runId}`,
              `- Run URL: ${runUrl}`,
              `- Branch: ${branch}`,
              `- Commit SHA: ${context.sha}`,
              '- Status: failed',
              '',
              'Check the `beegym-synthetic-health-report` artifact for the latest safe synthetic health report when it is available.',
              '',
              'Initial investigation checklist:',
              '',
              '- [ ] Open the failed workflow run and confirm whether the failure happened during build or smoke.',
              '- [ ] Download and inspect the `beegym-synthetic-health-report` artifact if it was uploaded.',
              '- [ ] Check whether `/` and `/login` failed or the local server failed to start.',
              '- [ ] Classify the signal using the BeeGym monitoring incident process before escalating.',
              '- [ ] Do not paste secrets, headers, cookies, tokens, or real user data into this issue.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const existingIssue = issues.find((issue) => issue.title === title && !issue.pull_request);

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existingIssue.number,
                body,
              });
              core.info(`Commented on existing issue #${existingIssue.number}.`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              core.info(`Created issue #${issue.number}.`);
            }
