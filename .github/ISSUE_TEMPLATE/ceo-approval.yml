name: CEO Approval
description: Request a CEO decision for sensitive or ambiguous work.
title: "[CEO Approval] "
labels:
  - autonomy:requires-ceo
body:
  - type: textarea
    id: decision
    attributes:
      label: Decisao necessaria
      description: Qual decisao o CEO precisa tomar?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Explique fatos conhecidos, bloqueios e origem da demanda.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risco
      options:
        - risk:low
        - risk:medium
        - risk:high
        - risk:critical
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas
      description: Liste opcoes reais e seus tradeoffs.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recomendacao do agente
      description: Inclua a recomendacao e a justificativa operacional.
    validations:
      required: true
  - type: textarea
    id: no-decision
    attributes:
      label: O que acontece se nao decidir
      description: Descreva impacto de adiar ou nao agir.
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Prazo
      placeholder: "Ex.: hoje, esta semana, sem prazo definido"
    validations:
      required: true
