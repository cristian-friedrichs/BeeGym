name: Agent Bug
description: Report a scoped defect for BeeGym agents to triage safely.
title: "[Agent Bug] "
labels:
  - type:bug
body:
  - type: input
    id: area
    attributes:
      label: Area afetada
      placeholder: "Ex.: Admin Agent Command Center, BeeGym OS docs, scripts de agente"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Use passos objetivos e sanitizados. Nao inclua dados reais de clientes ou secrets.
      placeholder: "1. Acessar a tela ou rotina...\n2. Executar a acao...\n3. Observar o comportamento..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento atual
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severidade
      options:
        - baixa
        - media
        - alta
        - critica
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencias
      description: Inclua logs sanitizados, prints ou links publicos. Nao cole tokens, secrets, dados reais, valores de .env ou informacoes sensiveis.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: "Ex.: local, preview PR, producao sem dados reais"
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risco
      options:
        - risk:low
        - risk:medium
        - risk:high
        - risk:critical
    validations:
      required: true
  - type: dropdown
    id: department
    attributes:
      label: Departamento responsavel
      options:
        - dept:ceo
        - dept:cto
        - dept:support
        - dept:marketing
        - dept:growth
        - dept:product
        - dept:finance
    validations:
      required: true
