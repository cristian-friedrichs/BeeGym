name: Agent Task
description: Create a safe, scoped task for BeeGym agents.
title: "[Agent Task] "
labels:
  - type:task
body:
  - type: dropdown
    id: department
    attributes:
      label: Departamento
      options:
        - dept:ceo
        - dept:cto
        - dept:support
        - dept:marketing
        - dept:growth
        - dept:product
        - dept:finance
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Tipo
      options:
        - type:bug
        - type:task
        - type:ui
        - type:docs
        - type:monitoring
        - type:automation
        - type:security-review
        - type:technical-debt
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risco
      options:
        - risk:low
        - risk:medium
        - risk:high
        - risk:critical
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo
      description: Descreva o resultado esperado, o limite da tarefa, o que nao deve mudar e qualquer area sensivel que deve permanecer fora.
      placeholder: "Ex.: revisar copy de estados vazios do Agent Command Center sem alterar logica, API, dados, auth ou billing."
    validations:
      required: true
  - type: textarea
    id: allowed-files
    attributes:
      label: Arquivos permitidos
      description: Liste apenas caminhos ou padroes que podem ser alterados. O agente deve parar se precisar tocar em algo fora desta lista.
      placeholder: |
        - src/components/admin/agentes/github-operational-panel.tsx
        - beegym-operating-system/autonomous-work-cycle.md
        - scripts/list-agent-ready-tasks.mjs
    validations:
      required: true
  - type: textarea
    id: forbidden-files
    attributes:
      label: Arquivos proibidos
      description: Liste areas que o agente nao pode tocar. Mantenha exemplos sensiveis explicitos quando a tarefa for Nivel 3.
      value: |
        - Supabase, migrations, RLS, policies, schema, RPCs e CLI
        - .env, .env.local e qualquer secret
        - auth, billing, pagamentos e dados reais
        - package.json, lockfiles e dependencias
        - Vercel config, deploy sensivel e workflows criticos
        - Arquivos fora do escopo permitido
    validations:
      required: true
  - type: textarea
    id: validations
    attributes:
      label: Validacoes obrigatorias
      description: Inclua comandos locais e checagens manuais proporcionais ao risco e ao tipo de mudanca.
      placeholder: |
        - npm.cmd run lint
        - npm.cmd run typecheck
        - npm.cmd run build
        - Confirmar que somente arquivos permitidos mudaram
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Criterios de aceite
      description: Defina criterios objetivos, verificaveis e alinhados ao escopo permitido.
      placeholder: |
        - O texto revisado aparece no painel sem alterar comportamento.
        - Nenhum arquivo proibido foi alterado.
        - As validacoes obrigatorias passaram ou a falha existente foi reportada.
    validations:
      required: true
  - type: dropdown
    id: level-3
    attributes:
      label: Pode operar Nivel 3?
      description: Use "sim" somente para tarefas de baixo risco, escopo claro e sem areas sensiveis.
      options:
        - "nao"
        - "sim"
    validations:
      required: true
  - type: dropdown
    id: ceo-approval
    attributes:
      label: Precisa aprovacao CEO?
      description: Use "sim" para risco medio ou maior, escopo ambiguo, dados reais, secrets, Supabase, Vercel sensivel, auth, billing, dependencias, migrations ou workflows criticos.
      options:
        - "nao"
        - "sim"
    validations:
      required: true
