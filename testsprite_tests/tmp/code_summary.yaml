version: "2"
type: frontend
tech_stack:
  - Language: TypeScript
  - Framework: Next.js 15 (App Router)
  - UI Library: Tailwind CSS, Radix UI, Lucide React
  - Database/Auth: Supabase
  - Forms: React Hook Form, Zod
routes:
  - path: /login
    file: src/app/login/page.tsx
    auth_required: false
    description: User login page
  - path: /register
    file: src/app/register/page.tsx
    auth_required: false
    description: User registration page
  - path: /app/painel
    file: src/app/app/(authenticated)/painel/page.tsx
    auth_required: true
    description: Main dashboard for organization metrics
  - path: /app/alunos
    file: src/app/app/(authenticated)/alunos/page.tsx
    auth_required: true
    description: Student list management page
  - path: /app/alunos/[id]
    file: src/app/app/(authenticated)/alunos/[id]/page.tsx
    auth_required: true
    description: Detailed student profile page
  - path: /app/alunos/[id]/invoices
    file: src/app/app/(authenticated)/alunos/[id]/invoices/page.tsx
    auth_required: true
    description: Individual student invoices list
  - path: /app/pagamentos
    file: src/app/app/(authenticated)/pagamentos/page.tsx
    auth_required: true
    description: Organization-wide payments and invoices management
  - path: /app/treinos
    file: src/app/app/(authenticated)/treinos/page.tsx
    auth_required: true
    description: Workout management and student assignment
  - path: /app/onboarding
    file: src/app/app/onboarding/page.tsx
    auth_required: true
    description: Initial onboarding and plan selection
features:
  - name: Student Registration & Management
    description: Create, view, and edit student profiles with address, contact, and plan details.
    files:
      - src/components/alunos/student-modal.tsx
      - src/app/app/(authenticated)/alunos/page.tsx
    entry_route: /app/alunos
    user_interactions:
      - Click "Adicionar Aluno"
      - Fill name, CPF, phone, and address
      - Select plan and dates
      - Click "Salvar" to register
    api_calls:
      - method: INSERT
        endpoint: students (Supabase)
    auth_required: true
  - name: Automated Invoice Generation
    description: Automatically generates a pending invoice when a new student is enrolled in a paid plan.
    files:
      - src/components/alunos/student-modal.tsx
    entry_route: /app/alunos
    user_interactions:
      - Register a student with a plan price > 0
    api_calls:
      - method: INSERT
        endpoint: invoices (Supabase)
    auth_required: true
  - name: PIX Payment (EFI Integration)
    description: Generate PIX QR codes and copyable payloads for outstanding invoices.
    files:
      - src/app/app/(authenticated)/pagamentos/page.tsx
      - src/app/api/efi/pix/generate/route.ts
    entry_route: /app/pagamentos
    user_interactions:
      - Select a pending invoice
      - Click "Gerar PIX"
      - View QR Code and Copy Payload
    api_calls:
      - method: POST
        endpoint: /api/efi/pix/generate
    auth_required: true
  - name: Workout Assignment
    description: Instructors can prescribe workouts with specific exercises and parameters to students.
    files:
      - src/app/app/(authenticated)/treinos/page.tsx
    entry_route: /app/treinos
    user_interactions:
      - Select a student
      - Click "Novo Treino"
      - Add exercises from library
      - Set reps, sets, and rest
      - Click "Salvar"
    api_calls:
      - method: INSERT
        endpoint: student_workouts (Supabase)
    auth_required: true
known_limitations:
  - issue: Permission system for discounts is currently bypassed if role is not found.
    location: src/components/alunos/student-modal.tsx
    impact: Users might manage discounts without explicit permission until app_roles are fully populated.
  - issue: Invoice creation failure doesn't block student registration.
    location: src/components/alunos/student-modal.tsx
    impact: A student might be created without an initial invoice if the second DB call fails.
